[project]
name = "multiai-tts"
version = "0.3.2"
description = "TTS extension for multiai using OpenAI, Google GenAI and Azure Speech"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Katsutoshi Seki"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "multiai",
    "openai",
    "google-genai",
    "azure-cognitiveservices-speech",
    "sounddevice",
    "soundfile",
    "requests",
]

[project.urls]
"Homepage" = "https://sekika.github.io/multiai-tts/"
"Bug Tracker" = "https://github.com/sekika/multiai-tts/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Make the src-layout package importable when running `pytest` from the repo
# root without an editable install.
pythonpath = ["src"]
